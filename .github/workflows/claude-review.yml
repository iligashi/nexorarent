name: Claude PR review

# Reviews every pull request with Claude Code and posts the findings as inline comments
# plus one summary comment. Needs one repository secret (Settings → Secrets and variables →
# Actions): ANTHROPIC_API_KEY, or CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`.
# Without a secret the job is skipped with a notice instead of failing.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A new push to the same PR cancels the review still running for the previous push.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    # Drafts wait until they are ready. Pull requests from forks get no secrets, so skip them.
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check for a Claude credential
        id: credential
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ] || [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Claude review skipped: add ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN as a repository secret."
          fi

      - uses: actions/checkout@v4
        if: steps.credential.outputs.present == 'true'
        with:
          fetch-depth: 1

      - name: Review
        if: steps.credential.outputs.present == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request as a senior engineer who cares most about security,
            correctness, clean code, repo health and performance. Read CLAUDE.md, README.md
            and docs/ first for the project's own rules.

            Check in particular:
            - Security: secrets or .env files committed, authentication and authorization on
              every route, input validation, SQL injection (all SQL must be parameterized),
              XSS/CSRF, cookie flags, rate limits, data that one user could see of another.
            - Correctness: races and transactions, error paths, time zones, null handling.
              While the Express API and the .NET API share one database, a ported route must
              keep the Express URL, status codes, messages and JSON shape, or the difference
              must be listed in docs/migration-plan.md.
            - Clean code: naming, duplication, dead code, strict typing, consistency with the
              patterns already in the repo.
            - Repo health: tests for new behaviour, CI, docs updated with the change.
            - Performance: N+1 queries, missing indexes, unbounded queries, needless work per
              request, bundle size and re-renders on the frontend.

            Only report real problems you can point to in the diff, each with the file and
            line, why it matters and a concrete fix. Rank findings by severity (critical, high,
            medium, low). Do not comment on style a formatter would fix, and do not praise.

            Post each finding as an inline comment on its line with
            mcp__github_inline_comment__create_inline_comment, then post one summary comment
            with `gh pr comment` that lists the findings by severity, or says that you found
            nothing that needs a change.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
